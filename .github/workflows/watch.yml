name: BX-53 stock watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bx53-stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q monitor.py shop_monitor.py validation_monitor.py tests
      - name: Run monitor regression tests
        run: python -m unittest discover -s tests -v
      - name: Run live non-BX53 control-page tests
        id: live_tests
        run: python validation_monitor.py
      - name: Check Amazon Japan BX-53
        if: steps.live_tests.outputs.mode == 'production'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py
      - name: Check other Japan retailers for BX-53
        if: steps.live_tests.outputs.mode == 'production'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python shop_monitor.py
      - name: Keep production status untouched while validating control pages
        if: steps.live_tests.outputs.mode != 'production'
        run: echo "Live control-page validation incomplete; existing BX-53 production status files are preserved."
      - name: Publish status and test report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-status.json
          if [ -f docs/status.json ]; then git add docs/status.json; fi
          if [ -f docs/shop-status.json ]; then git add docs/shop-status.json; fi
          git diff --cached --quiet || git commit -m "Update stock monitor validation status"
          git push
      - name: Stop temporary 15-minute schedule at 05:00 Taiwan time
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF_EPOCH: "1793653200"
        run: |
          now=$(date -u +%s)
          if [ "$now" -ge "$CUTOFF_EPOCH" ]; then
            echo "Monitoring window ended at 05:00 Asia/Taipei. Disabling this temporary workflow schedule."
            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml/disable"
          else
            echo "Before cutoff; keep the 15-minute monitoring schedule active."
          fi
